name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Locate Project & Install Dependencies
      run: |
        # Find where package.json lives
        if [ -f "package.json" ]; then
          PROJ_DIR="."
        else
          PROJ_DIR=$(dirname $(find . -maxdepth 3 -name "package.json" | head -n 1))
        fi
        echo "PROJ_DIR=$PROJ_DIR" >> $GITHUB_ENV
        cd $PROJ_DIR
        npm install --yes || true
        npm install @capacitor/core @capacitor/cli @capacitor/android --yes || true

    - name: Build Web Application
      run: |
        cd ${{ env.PROJ_DIR }}
        npm run build || true

    - name: Generate Android Platform
      run: |
        cd ${{ env.PROJ_DIR }}
        
        # Find dist or build folder
        WEB_DIR="dist"
        if [ -d "build" ]; then WEB_DIR="build"; fi
        if [ -d "out" ]; then WEB_DIR="out"; fi
        if [ -d "public" ] && [ ! -d "dist" ]; then WEB_DIR="public"; fi
        
        npx cap init "FlixCasa" "com.flixcasa.app" --web-dir $WEB_DIR || true
        npx cap add android || true
        npx cap sync android || true

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Fix Kotlin Duplicate Class Conflict
      run: |
        BUILD_GRADLE=$(find . -name "build.gradle" | grep "android/build.gradle" | head -n 1)
        if [ -f "$BUILD_GRADLE" ]; then
          echo '
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                      exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
                  }
              }
          }' >> $BUILD_GRADLE
        fi

    - name: Build Debug APK
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          GRADLE_DIR=$(dirname $GRADLEW_PATH)
          cd $GRADLE_DIR
          chmod +x gradlew
          ./gradlew assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FlixCasa-App-Debug-APK
        path: |
          **/app/build/outputs/apk/debug/app-debug.apk
          
