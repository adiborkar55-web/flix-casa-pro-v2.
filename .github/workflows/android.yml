name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: |
        npm install --yes || true
        npm install @capacitor/core @capacitor/cli @capacitor/android --yes || true

    - name: Generate Android Platform
      run: |
        mkdir -p www
        if [ -f "index.html" ]; then
          cp index.html www/
        else
          echo "<html><body><h1>FlixCasa App</h1></body></html>" > www/index.html
        fi
        npx cap init "FlixCasa" "com.flixcasa.app" --web-dir www || true
        npx cap add android || true
        npx cap sync android || true

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Fix Kotlin Duplicate Class Conflict
      run: |
        if [ -f "android/build.gradle" ]; then
          echo '
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                      exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
                  }
              }
          }' >> android/build.gradle
        fi

    - name: Build Debug APK
      run: |
        if [ -d "android" ]; then
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FlixCasa-App-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
