name: Auto Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: |
        npm install
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Build Web Assets
      run: |
        npm run build || (mkdir -p dist && cp index.html dist/ 2>/dev/null) || true

    - name: Auto Generate Android Folder
      run: |
        npx cap init "FlixCasa" "com.flixcasa.app" --web-dir dist || true
        npx cap add android || true
        npx cap sync android || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FlixCasa-App-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
